  app.append(h,E('p','lead','Nine weeks of Java: classes, strings, inheritance, packages and interfaces. Pick a week and dive in.'));
  const me=E('div','me'),im=E('img');im.alt='Profile';im.src='assets/profile.png';im.onerror=()=>{im.onerror=null;im.src=FB};
  const d=E('dl');[['Name','M Rahul Balaji'],['Roll No','25EU02093'],['Year','II Year'],['Branch','AI&ML'],['Section','B'],['Subject','Java Programming']].forEach(([a,b])=>d.append(E('dt','',a),E('dd','',b)));
  me.append(im,d);app.append(me,E('h2','t','Pick a week'));
  const g=E('div','tiles');KEYS.forEach((k,j)=>{const t=E('button','tile');t.style.background=COL[j];t.append(E('b','',k),E('small','',W[k].t));t.onclick=()=>go(k);g.append(t)});
  app.append(g);
}
function table(k,w){
  app.append(E('h2','t','Week '+k+': '+w.t));
  const t=E('table');w.tbl.forEach((r,n)=>{const tr=E('tr');r.forEach(c=>tr.append(E(n?'td':'th','',c)));t.append(tr)});app.append(t);
}
function list(k,w){
  app.append(E('h2','t','Week '+k+': '+w.t));
  w.ps.forEach((p,n)=>{const r=E('button','row');r.append(E('b','','P'+String(n+1).padStart(2,'0')),E('span','',p[0].replace(/^Program \d+: /,'')));r.onclick=()=>go(k+'/'+n);app.append(r)});
}
function prog(k,w,i){
  const p=w.ps[i];
  app.append(E('h2','t',p[0]));
  if(p[1])app.append(E('p','aim','Aim: '+p[1]));
  const box=E('div');
  const code=E('pre','',p[2]),out=E('pre','o',p[1]?p[3]:'');
  const bar=E('div','bar');
  if(p[1]){
    const bc=btn('{ } Code',()=>{box.replaceChildren(code);bc.classList.add('on');bo.classList.remove('on')},'on');
    const bo=btn('> Run / Output',()=>{box.replaceChildren(out);bo.classList.add('on');bc.classList.remove('on')},'run');
    bar.append(bc,bo);
  }
  const cp=btn('Copy',()=>{try{navigator.clipboard.writeText(p[2]);cp.textContent='Copied!';setTimeout(()=>cp.textContent='Copy',1200)}catch(e){}});
  bar.append(cp);box.append(code);
  app.append(bar,box);
  const nv=E('div','bar');
  const pv=btn('< Prev',()=>go(k+'/'+(i-1)));pv.disabled=i==0;
  const nx=btn('Next >',()=>go(k+'/'+(i+1)));nx.disabled=i==w.ps.length-1;
  nv.append(pv,btn('All programs',()=>go(k)),nx);app.append(nv);
}
function safe(){try{route()}catch(e){app.textContent='Error: '+e.message}}
addEventListener('hashchange',safe);safe();
</script></body></html>
